        <script>
          // Email / deep links use path+query (survives click trackers). HashRouter
          // only reads the hash — bounce path routes into /#/... before React loads.
          (function () {
            var paths = {
              '/verify-email': true,
              '/reset-password': true,
              '/forgot-password': true,
              '/delete-account': true,
              '/register': true,
              '/login': true,
              '/meal-planner': true,
              '/settings/preferences': true
            };
            var path = window.location.pathname.replace(/\/+$/, '') || '/';
            var sharePath = /^(?:\/recipe|\/r|\/shared)\/[^/]+$/.test(path);
            if ((paths[path] || sharePath) && !window.location.hash) {
              // Keep the outside referrer for link tracking (the bounce replaces it with laro.food)
              try { if (document.referrer) sessionStorage.setItem('laro_entry_referrer', document.referrer); } catch (e) {}
              window.location.replace(
                '/#' + path + window.location.search
              );
            }
          })();
        </script>
